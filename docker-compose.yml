services:
  backend:
    build: ./backend
    environment:
      APP_ENV: production
      CORS_ORIGINS: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-25000000}
      MAX_IMAGE_DIMENSION: ${MAX_IMAGE_DIMENSION:-8000}
      FILE_RETENTION_HOURS: ${FILE_RETENTION_HOURS:-24}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
    volumes:
      - storage:/data/storage
    restart: unless-stopped
    # Not published: only reachable through Nginx.

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/${NGINX_CONF:-nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx-common.conf:/etc/nginx/snippets/common.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  # Run on demand only: docker compose run --rm certbot ...
  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt

volumes:
  storage:
