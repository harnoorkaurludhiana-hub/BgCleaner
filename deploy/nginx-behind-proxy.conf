# For servers that already run a web server (e.g. host Nginx) on ports 80/443.
# That web server handles the domain and HTTPS, then forwards to this container on 127.0.0.1:8080.
limit_req_zone $binary_remote_addr zone=uploads:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_status 429;

# Requests arrive via Docker's network from the host web server. Trust the visitor IP it sends,
# so rate limits apply per visitor instead of to everyone at once.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/common.conf;
}
